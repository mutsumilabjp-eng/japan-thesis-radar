<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Japan Thesis Radar</title>
<style>
  :root {
    --bg: #F8F5F0;
    --navy: #1E3A5F;
    --blue: #4A6FA5;
    --border: #DCD5C8;
    --card-bg: #FFFFFF;
    --muted: #6B7280;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--navy);
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif;
    line-height: 1.7;
  }
  header {
    background: var(--navy);
    color: var(--bg);
    padding: 20px 24px;
  }
  header h1 {
    margin: 0 0 4px 0;
    font-size: 1.4rem;
    letter-spacing: 0.02em;
  }
  header p {
    margin: 0;
    font-size: 0.85rem;
    color: #C9D6E5;
  }
  nav {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    background: var(--card-bg);
    border-bottom: 1px solid var(--border);
    padding: 8px 16px;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  nav button {
    background: transparent;
    border: 1px solid transparent;
    color: var(--navy);
    padding: 8px 14px;
    font-size: 0.9rem;
    border-radius: 6px;
    cursor: pointer;
    font-family: inherit;
  }
  nav button:hover { background: #EFEAE0; }
  nav button.active {
    background: var(--navy);
    color: var(--bg);
  }
  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 24px 16px 80px;
  }
  h2 { font-size: 1.15rem; margin-top: 0; }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
    margin-bottom: 14px;
  }
  .card-title {
    font-weight: 700;
    font-size: 1.05rem;
  }
  .muted { color: var(--muted); font-size: 0.85rem; }
  .badge {
    display: inline-block;
    background: #EAF0F8;
    color: var(--blue);
    border: 1px solid var(--blue);
    border-radius: 999px;
    padding: 2px 10px;
    font-size: 0.78rem;
    margin-right: 6px;
    margin-bottom: 4px;
  }
  .badge.stance-追い風 { color: #1E5F3A; border-color: #1E5F3A; background: #EAF5EE; }
  .badge.stance-懸念 { color: #8A4B1E; border-color: #8A4B1E; background: #F7EEE4; }
  .badge.stance-事実言及 { color: var(--blue); border-color: var(--blue); background: #EAF0F8; }
  .badge.stance-判断不明 { color: var(--muted); border-color: var(--muted); background: #F0EFEC; }
  .topic-row {
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
    border-bottom: 1px dashed var(--border);
    font-size: 0.95rem;
  }
  .topic-row:last-child { border-bottom: none; }
  a { color: var(--blue); }
  .clickable { cursor: pointer; }
  .clickable:hover { text-decoration: underline; }
  .post-item {
    border-top: 1px solid var(--border);
    padding: 10px 0;
  }
  .post-item:first-child { border-top: none; }
  .post-meta {
    font-size: 0.82rem;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .change-block h3 {
    font-size: 0.9rem;
    margin: 10px 0 4px;
    color: var(--blue);
  }
  .empty { color: var(--muted); font-size: 0.9rem; }
  footer {
    max-width: 900px;
    margin: 0 auto;
    padding: 16px;
    font-size: 0.78rem;
    color: var(--muted);
    border-top: 1px solid var(--border);
  }
  .back-link {
    display: inline-block;
    margin-bottom: 12px;
    font-size: 0.9rem;
    cursor: pointer;
    color: var(--blue);
  }
</style>
</head>
<body>

<header>
  <h1>Japan Thesis Radar</h1>
  <p>公開Xの投稿を、銘柄ごとの投資論点とその変化に整理するリサーチツール</p>
</header>

<nav id="nav"></nav>

<main id="main">
  <p class="empty">読み込み中...</p>
</main>

<footer>
  本ツールは公開情報を整理するリサーチツールであり、投資助言・売買推奨・将来の株価予測を目的とするものではありません。
  分類・要約はAIおよび自動処理によるものであり、誤りが含まれる可能性があります。投資判断にあたっては、必ず元投稿・一次情報をご自身でご確認ください。
</footer>

<script>
const VIEWS = [
  { id: "tickers", label: "銘柄一覧" },
  { id: "topics", label: "論点一覧" },
  { id: "authors", label: "投稿者別" },
  { id: "new_topics", label: "新規論点" },
  { id: "topic_changes", label: "論点変化" },
];

let DATA = null;
let currentView = "tickers";
let currentTicker = null;

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

function fmtDate(iso) {
  if (!iso) return "日時不明";
  const d = new Date(iso);
  if (isNaN(d.getTime())) return iso;
  return d.toLocaleString("ja-JP", { year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" });
}

function renderNav() {
  const nav = document.getElementById("nav");
  nav.innerHTML = "";
  VIEWS.forEach((v) => {
    const btn = document.createElement("button");
    btn.textContent = v.label;
    btn.className = v.id === currentView ? "active" : "";
    btn.onclick = () => { currentView = v.id; currentTicker = null; render(); };
    nav.appendChild(btn);
  });
}

function postsForTicker(ticker) {
  return DATA.records.filter((r) => r.ticker === ticker);
}

function renderPostList(posts) {
  if (!posts.length) return '<p class="empty">該当する投稿はありません。</p>';
  return posts.map((p) => `
    <div class="post-item">
      <div class="post-meta">${esc(p.display_name || p.handle)}（${esc(p.handle)}） ・ ${fmtDate(p.post_created_at)}</div>
      <span class="badge stance-${esc(p.stance)}">${esc(p.stance)}</span>
      <span class="badge">${esc(p.topic)}</span>
      <div>${esc(p.summary)}</div>
      <div><a href="${esc(p.source_url)}" target="_blank" rel="noopener noreferrer">元投稿を見る →</a></div>
    </div>
  `).join("");
}

function renderTickersList() {
  if (!DATA.tickers.length) return '<p class="empty">データがありません。</p>';
  return DATA.tickers.map((t) => {
    const topTopics = t.topics.slice(0, 3).map((x) => `${esc(x.topic)} ${x.count}件`).join(" / ");
    return `
      <div class="card clickable" data-ticker="${esc(t.ticker)}">
        <div class="card-title">${esc(t.ticker)} ${esc(t.company)}</div>
        <div class="muted">${topTopics || "論点なし"}</div>
      </div>
    `;
  }).join("");
}

function renderTickerDetail(ticker) {
  const t = DATA.tickers.find((x) => x.ticker === ticker);
  if (!t) return '<p class="empty">銘柄が見つかりません。</p>';
  const change = DATA.topic_changes.find((c) => c.ticker === ticker);

  const topicRows = t.topics.map((x) => `
    <div class="topic-row"><span>${esc(x.topic)}</span><span>${x.count}件</span></div>
  `).join("");

  const newTopics = change && change.new_topics.length
    ? change.new_topics.map((tp) => `<span class="badge">${esc(tp)}</span>`).join("")
    : '<span class="empty">今週の新規論点はありません</span>';

  const disappearedTopics = change && change.disappeared_topics.length
    ? change.disappeared_topics.map((tp) => `<span class="badge">${esc(tp)}</span>`).join("")
    : '<span class="empty">前週から消えた論点はありません</span>';

  const posts = postsForTicker(ticker);

  return `
    <div class="back-link" onclick="currentView='tickers';render();">← 銘柄一覧に戻る</div>
    <h2>${esc(t.ticker)} ${esc(t.company)}</h2>

    <div class="card">
      <div class="card-title">最近${esc(DATA.window_days)}日の主要論点</div>
      ${topicRows || '<p class="empty">論点なし</p>'}
    </div>

    <div class="card change-block">
      <h3>今週新しく出た論点</h3>
      <div>${newTopics}</div>
      <h3>前週から消えた論点</h3>
      <div>${disappearedTopics}</div>
    </div>

    <div class="card">
      <div class="card-title">投稿一覧</div>
      ${renderPostList(posts)}
    </div>
  `;
}

function renderTopicsList() {
  if (!DATA.topics.length) return '<p class="empty">データがありません。</p>';
  return DATA.topics.map((tp) => {
    const tickerBadges = tp.tickers.map((tk) => {
      const info = DATA.tickers.find((x) => x.ticker === tk);
      const label = info ? `${tk} ${info.company}` : tk;
      return `<span class="badge clickable" data-ticker="${esc(tk)}">${esc(label)}</span>`;
    }).join("");
    return `
      <div class="card">
        <div class="card-title">${esc(tp.topic)} <span class="muted">（${tp.total_count}件）</span></div>
        <div>${tickerBadges}</div>
      </div>
    `;
  }).join("");
}

function renderAuthorsList() {
  if (!DATA.authors.length) return '<p class="empty">データがありません。</p>';
  return DATA.authors.map((a) => {
    const posts = DATA.records.filter((r) => r.handle === a.handle);
    return `
      <div class="card">
        <div class="card-title">${esc(a.display_name || a.handle)} <span class="muted">${esc(a.handle)}</span></div>
        <div class="muted">投稿数: ${a.post_count}件</div>
        ${renderPostList(posts)}
      </div>
    `;
  }).join("");
}

function renderNewTopics() {
  const withNew = DATA.topic_changes.filter((c) => c.new_topics.length);
  if (!withNew.length) return '<p class="empty">今週新しく出た論点はありません。</p>';
  return withNew.map((c) => `
    <div class="card clickable" data-ticker="${esc(c.ticker)}">
      <div class="card-title">${esc(c.ticker)} ${esc(c.company)}</div>
      <div>${c.new_topics.map((tp) => `<span class="badge">${esc(tp)}</span>`).join("")}</div>
    </div>
  `).join("");
}

function renderTopicChanges() {
  if (!DATA.topic_changes.length) return '<p class="empty">データがありません。</p>';
  return DATA.topic_changes.map((c) => `
    <div class="card clickable" data-ticker="${esc(c.ticker)}">
      <div class="card-title">${esc(c.ticker)} ${esc(c.company)}</div>
      <h3 style="font-size:0.85rem;margin:8px 0 2px;color:var(--blue);">新規</h3>
      <div>${c.new_topics.length ? c.new_topics.map((tp) => `<span class="badge">${esc(tp)}</span>`).join("") : '<span class="empty">なし</span>'}</div>
      <h3 style="font-size:0.85rem;margin:8px 0 2px;color:var(--blue);">継続</h3>
      <div>${c.continuing_topics.length ? c.continuing_topics.map((tp) => `<span class="badge">${esc(tp)}</span>`).join("") : '<span class="empty">なし</span>'}</div>
      <h3 style="font-size:0.85rem;margin:8px 0 2px;color:var(--blue);">消滅</h3>
      <div>${c.disappeared_topics.length ? c.disappeared_topics.map((tp) => `<span class="badge">${esc(tp)}</span>`).join("") : '<span class="empty">なし</span>'}</div>
    </div>
  `).join("");
}

function render() {
  renderNav();
  const main = document.getElementById("main");

  if (currentTicker) {
    main.innerHTML = renderTickerDetail(currentTicker);
  } else if (currentView === "tickers") {
    main.innerHTML = `<h2>銘柄一覧</h2>${renderTickersList()}`;
  } else if (currentView === "topics") {
    main.innerHTML = `<h2>論点一覧</h2>${renderTopicsList()}`;
  } else if (currentView === "authors") {
    main.innerHTML = `<h2>投稿者別</h2>${renderAuthorsList()}`;
  } else if (currentView === "new_topics") {
    main.innerHTML = `<h2>新規論点</h2>${renderNewTopics()}`;
  } else if (currentView === "topic_changes") {
    main.innerHTML = `<h2>論点変化</h2>${renderTopicChanges()}`;
  }

  main.querySelectorAll("[data-ticker]").forEach((el) => {
    el.addEventListener("click", () => {
      currentTicker = el.getAttribute("data-ticker");
      render();
    });
  });
}

async function init() {
  try {
    const res = await fetch("../data/latest.json");
    if (!res.ok) throw new Error("HTTP " + res.status);
    DATA = await res.json();
  } catch (e) {
    document.getElementById("main").innerHTML =
      `<p class="empty">data/latest.json の読み込みに失敗しました: ${esc(e.message)}</p>`;
    return;
  }
  render();
}

init();
</script>
</body>
</html>
