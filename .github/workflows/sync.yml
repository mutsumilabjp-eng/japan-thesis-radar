name: Sync Sheets and Build Dataset

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync Google Sheets
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEETS_SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID }}
          GOOGLE_SHEETS_WORKSHEET_NAME: ${{ secrets.GOOGLE_SHEETS_WORKSHEET_NAME }}
        run: python scripts/sync_sheets.py

      - name: Build dataset
        run: python scripts/build_dataset.py

      - name: Commit if changed
        run: |
          git config user.name "japan-thesis-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet -- data/; then
            git add data/
            git commit -m "chore: sync sheets and rebuild dataset [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi
